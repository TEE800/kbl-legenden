# Einstellungen fuer das automatische Einspielen des Tippdienstes (.github/workflows/tippdienst.yml).
# Entspricht der Einrichtung im Cloudflare-Dashboard (ANLEITUNG.md). ADMIN_CODE bleibt als Geheimnis in Cloudflare.
name = "kbl-tipps"
main = "worker.js"
compatibility_date = "2026-10-01"
keep_vars = true

[[kv_namespaces]]
binding = "TIPPS"
id = "8829ebef1b34462584800039bb03d78d"

[vars]
SITE_URL = "https://tee800.github.io/kbl-legenden"

# Push-Nachrichten: alle 5 Minuten pruefen (worker.js, pushTick).
[triggers]
crons = ["*/5 * * * *"]

# Nutzung zaehlen (ANLEITUNG.md, "Nutzung der App zaehlen"): D1-Datenbank kbl-nutzung als NUTZUNG.
[[d1_databases]]
binding = "NUTZUNG"
database_name = "kbl-nutzung"
database_id = "2c11fbc1-893b-41ce-8b99-9c5ee03c7848"
