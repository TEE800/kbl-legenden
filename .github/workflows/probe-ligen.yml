name: Probe Ligen (einmalig)
on:
  push:
    branches: [claude/project-thread-gpa85w]
    paths: ['_probe-ligen/probe.mjs']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - env:
          KBL_AUTO_EMAIL: ${{ secrets.KBL_AUTO_EMAIL }}
          KBL_AUTO_PASSWORD: ${{ secrets.KBL_AUTO_PASSWORD }}
        run: node _probe-ligen/probe.mjs
      - run: |
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add _probe-ligen/ergebnis.json && git commit -m "Probe Ligen Ergebnis" && git push
