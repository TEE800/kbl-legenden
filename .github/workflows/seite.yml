name: Seite aktualisieren
on:
  schedule:
    # Kevin-Vorgabe 7.11. (nach der GitHub-Sperre am 6.11.): keine Livepunkte mehr waehrend der Spiele,
    # nur noch kurze Laeufe nach Spielende (Winterzeit, UTC): Fr 22:40, Sa 17:40 und 20:40, So 17:40, 19:40 und 21:40 Uhr.
    - cron: '40 21 * * 5'
    - cron: '40 16,19 * * 6'
    - cron: '40 16,18,20 * * 0'
    - cron: '7 4 * * *'      # einmal taeglich (6:07 Uhr) alles neu: Korrekturen, Transfers, Tabelle
  workflow_dispatch:
    inputs:
      bericht_neu:
        description: 'Spieltagsbericht fuer diesen Spieltag neu schreiben lassen (leer = nichts neu)'
        required: false
        default: ''
      live:
        description: 'Nur kurzer Lauf (laufender bzw. gerade beendeter Spieltag statt alles)'
        required: false
        default: 'false'
  push:                      # nach Programm-Aenderungen gleich neu bauen, voll (sonst bleiben beendete Spieltage bis 6:07 auf altem Stand)
    branches: [main]
    paths: ['public/**', 'server.js', 'challenges.js', 'event-types-de.js', 'tools/export-static.mjs', 'tools/spieltagsbericht.mjs', 'tools/kickbase-bremse.mjs', 'tools/kinn-linien.mjs', 'tools/png.mjs']
permissions:
  contents: write
  pages: write
  id-token: write
  actions: write            # damit sich der Live-Lauf selbst wieder anstossen kann
concurrency:
  group: seite
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - id: gate
        name: Laeuft gerade ein Spieltag?
        run: |
          echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"
          echo "aktiv=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.aktiv == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.gate.outputs.aktiv == 'true'
      - name: Kinnlinien fuer neue Spielerfotos (Wackelkoepfe)
        if: steps.gate.outputs.aktiv == 'true'
        continue-on-error: true
        run: |
          node tools/kinn-linien.mjs --pruefen && exit 0
          npm i --no-save --no-package-lock --no-audit --no-fund @vladmandic/face-api@1.7.15 @tensorflow/tfjs@4.22.0 @tensorflow/tfjs-backend-wasm@4.22.0
          node tools/kinn-linien.mjs
      # Der Voll-Lauf nach einem Programm-Push wird oft abgebrochen, weil ein wartender Live-Lauf ihn in der Warteschlange ersetzt
      # (concurrency, 1.11.: Koch blieb an ST 8 auf 0). Darum merkt sich jeder Voll-Lauf den Programmstand (Hash der Dateien);
      # weicht er ab, laeuft auch ein Live-Lauf einmal voll.
      - id: mode
        name: Live oder voll?
        if: steps.gate.outputs.aktiv == 'true'
        run: |
          m=${{ ((github.event_name == 'schedule' && github.event.schedule != '7 4 * * *') || github.event.inputs.live == 'true') && 'live' || 'full' }}
          code=$(git ls-files -s public server.js challenges.js event-types-de.js tools | sha1sum | cut -c1-40)
          alt=$(node -e "try{console.log(require('./kbl-voll-code.json').code)}catch{console.log('')}")
          if [ "$m" = "live" ] && [ "$alt" != "$code" ]; then m=full; echo "Programm seit dem letzten Voll-Lauf geaendert: dieser Lauf ist voll"; fi
          echo "mode=$m" >> "$GITHUB_OUTPUT"; echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Daten abrufen und Seite bauen
        if: steps.gate.outputs.aktiv == 'true'
        env:
          KBL_AUTO_EMAIL: ${{ secrets.KBL_AUTO_EMAIL }}
          KBL_AUTO_PASSWORD: ${{ secrets.KBL_AUTO_PASSWORD }}
          KBL_TIPP_DIENST: ${{ vars.KBL_TIPP_DIENST }}
        run: |
          node tools/export-static.mjs ${{ steps.mode.outputs.mode }}
          if [ "${{ steps.mode.outputs.mode }}" = "full" ]; then echo '{"code":"${{ steps.mode.outputs.code }}"}' > kbl-voll-code.json; fi
      - name: Spieltagsbericht (Claude, nur nach der Abrechnung, einmal je Spieltag)
        if: steps.gate.outputs.aktiv == 'true'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KBL_ADMIN_CODE: ${{ secrets.KBL_ADMIN_CODE }}
          KBL_TIPP_DIENST: ${{ vars.KBL_TIPP_DIENST }}
          KBL_BERICHT_MODEL: ${{ vars.KBL_BERICHT_MODEL }}
          KBL_BERICHT_NEU: ${{ github.event.inputs.bericht_neu }}
        run: node tools/spieltagsbericht.mjs
      - uses: actions/upload-pages-artifact@v3
        if: steps.gate.outputs.aktiv == 'true'
        with:
          path: site
      - id: deploy
        if: steps.gate.outputs.aktiv == 'true'
        uses: actions/deploy-pages@v4
      - name: Gespeicherte Daten sichern
        if: steps.gate.outputs.aktiv == 'true'
        run: |
          git config user.name "kbl-bot"
          git config user.email "kbl-bot@users.noreply.github.com"
          git add kbl-*.json site
          git diff --cached --quiet && exit 0
          git commit -m "Daten aktualisiert"
          # Bei gleichzeitigen Aenderungen gewinnen die eben erzeugten Daten.
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; sleep 5; done
          exit 1
