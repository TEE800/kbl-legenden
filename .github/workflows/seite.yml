name: Seite aktualisieren
on:
  schedule:
    - cron: '*/5 * * * *'    # alle 5 Minuten, aber nur waehrend Bundesliga-Spielen (siehe tools/spieltag-aktiv.mjs)
    - cron: '7 4 * * *'      # einmal taeglich (6:07 Uhr) alles neu: Korrekturen, Transfers, Tabelle
  workflow_dispatch:
    inputs:
      bericht_neu:
        description: 'Spieltagsbericht fuer diesen Spieltag neu schreiben lassen (leer = nichts neu)'
        required: false
        default: ''
      live:
        description: 'Nur Live-Lauf (stoesst der Lauf waehrend der Spiele alle 5 Min. selbst an)'
        required: false
        default: 'false'
  push:                      # nach Programm-Aenderungen gleich neu bauen, voll (sonst bleiben beendete Spieltage bis 6:07 auf altem Stand)
    branches: [main]
    paths: ['public/**', 'server.js', 'challenges.js', 'event-types-de.js', 'tools/export-static.mjs', 'tools/spieltagsbericht.mjs', 'tools/kickbase-bremse.mjs', 'tools/kinn-linien.mjs', 'tools/png.mjs', 'kbl-challenge-cache.json']
permissions:
  contents: write
  pages: write
  id-token: write
  actions: write            # damit sich der Live-Lauf selbst wieder anstossen kann
concurrency:
  group: seite
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - id: gate
        name: Laeuft gerade ein Spieltag?
        run: |
          echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event.schedule }}" = "*/5 * * * *" ] || [ "${{ github.event.inputs.live }}" = "true" ]; then node tools/spieltag-aktiv.mjs; else echo "aktiv=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.aktiv == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.gate.outputs.aktiv == 'true'
      - name: Kinnlinien fuer neue Spielerfotos (Wackelkoepfe)
        if: steps.gate.outputs.aktiv == 'true'
        continue-on-error: true
        run: |
          node tools/kinn-linien.mjs --pruefen && exit 0
          npm i --no-save --no-package-lock --no-audit --no-fund @vladmandic/face-api@1.7.15 @tensorflow/tfjs@4.22.0 @tensorflow/tfjs-backend-wasm@4.22.0
          node tools/kinn-linien.mjs
      - name: Daten abrufen und Seite bauen
        if: steps.gate.outputs.aktiv == 'true'
        env:
          KBL_AUTO_EMAIL: ${{ secrets.KBL_AUTO_EMAIL }}
          KBL_AUTO_PASSWORD: ${{ secrets.KBL_AUTO_PASSWORD }}
          KBL_TIPP_DIENST: ${{ vars.KBL_TIPP_DIENST }}
        run: node tools/export-static.mjs ${{ (github.event.schedule == '*/5 * * * *' || github.event.inputs.live == 'true') && 'live' || 'full' }}
      - name: Spieltagsbericht (Claude, nur nach der Abrechnung, einmal je Spieltag)
        if: steps.gate.outputs.aktiv == 'true'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KBL_ADMIN_CODE: ${{ secrets.KBL_ADMIN_CODE }}
          KBL_TIPP_DIENST: ${{ vars.KBL_TIPP_DIENST }}
          KBL_BERICHT_MODEL: ${{ vars.KBL_BERICHT_MODEL }}
          KBL_BERICHT_NEU: ${{ github.event.inputs.bericht_neu }}
        run: node tools/spieltagsbericht.mjs
      - uses: actions/upload-pages-artifact@v3
        if: steps.gate.outputs.aktiv == 'true'
        with:
          path: site
      - id: deploy
        if: steps.gate.outputs.aktiv == 'true'
        uses: actions/deploy-pages@v4
      - name: Gespeicherte Daten sichern
        if: steps.gate.outputs.aktiv == 'true'
        run: |
          git config user.name "kbl-bot"
          git config user.email "kbl-bot@users.noreply.github.com"
          git add kbl-*.json site
          git diff --cached --quiet && exit 0
          git commit -m "Daten aktualisiert"
          # Bei gleichzeitigen Aenderungen gewinnen die eben erzeugten Daten.
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; sleep 5; done
          exit 1
      # GitHub startet den 5-Minuten-Zeitplan nur etwa alle 45 bis 60 Minuten (ST 8: Livepunkte online fast eine Stunde alt).
      # Waehrend der Spiele (und solange Online-Daten offen sind) stoesst sich der Lauf darum selbst wieder an, 5 Min. nach seinem Start.
      # Laufen zwei Ketten gleichzeitig, bleibt durch concurrency nur ein wartender Lauf uebrig, sie fallen wieder zu einer zusammen.
      - name: Naechsten Live-Lauf in 5 Minuten anstossen
        if: ${{ !cancelled() && steps.gate.outputs.weiter == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rest=$(( 300 - $(date +%s) + ${{ steps.gate.outputs.start }} - 20 ))
          [ "$rest" -gt 0 ] && sleep "$rest"
          gh workflow run seite.yml --repo "${{ github.repository }}" --ref main -f live=true
